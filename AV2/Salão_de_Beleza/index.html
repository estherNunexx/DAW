<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salão de Beleza</title>

<script src="js/script.js"></script>

<style>
body{
    font-family: Arial;
    margin: 40px;
}

input{
    width: 250px;
    padding: 5px;
}

button{
    padding: 8px;
    margin-top: 5px;
}

</style>
</head>

<body>
<h1>Bem-vindo de volta!</h1>
<p>sentimos sua falta</p>

<!--login-->
<div id="login">

<h2>Login</h2>

<label>Email</label><br>
<input type="email" id="emailLogin"><br><br>

<label>Senha</label><br>
<input type="password" id="senhaLogin"><br><br>

<button onclick="entrar()">
Entrar
</button>

<br><br>

<p>não tem conta?</p>
<button onclick="mostrarCadastro()">
Cadastre-se
</button>

</div>
<!--cadastro-->
<div id="cadastro" style="display:none;">

<h2>Cadastro de Cliente</h2>

<label>Nome</label><br>
<input type="text" id="nome"><br><br>

<label>CPF</label><br>
<input type="text" id="cpf"><br><br>

<label>Data de Nascimento</label><br>
<input type="date" id="data"><br><br>

<label>Email</label><br>
<input type="email" id="email"><br><br>

<label>Senha</label><br>
<input type="password" id="senha"><br><br>

<label>Confirmar Senha</label><br>
<input type="password" id="senha2"><br><br>

<button onclick="cadastrar()">
Confirmar Cadastro
</button>

<button onclick="mostrarLogin()">
Voltar para Login
</button>

</div>
</body>
</html>
