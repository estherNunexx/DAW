<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Salão de Beleza</title>

<link rel="stylesheet" href="css/style.css">

<script src="js/script.js"></script>

</head>

<body>

<section class="login">

<div class="login-box">

<h1>Bem-vindo de volta!</h1>

<p>Sentimos sua falta 💚</p>

<!-- LOGIN -->
<div id="login">

<h2>Login</h2>

<label>Email</label>
<input type="email" id="emailLogin">

<label>Senha</label>
<input type="password" id="senhaLogin">

<button onclick="entrar()">
Entrar
</button>

<p class="texto-centro">
Não tem conta?
</p>

<button class="btn-secundario" onclick="mostrarCadastro()">
Cadastre-se
</button>

</div>

<!-- CADASTRO -->
<div id="cadastro" style="display:none;">

<h2>Cadastro</h2>

<label>Nome</label>
<input type="text" id="nome">

<label>CPF</label>
<input type="text" id="cpf">

<label>Data de Nascimento</label>
<input type="date" id="data">

<label>Email</label>
<input type="email" id="email">

<label>Senha</label>
<input type="password" id="senha">

<label>Confirmar Senha</label>
<input type="password" id="senha2">

<button onclick="cadastrar()">
Cadastrar
</button>

<button class="btn-secundario" onclick="mostrarLogin()">
Voltar para Login
</button>

</div>

</div>

</section>

</body>
</html>
