<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagamento</title>

<link rel="stylesheet" href="css/style.css">

<script src="js/pagamento.js"></script>

</head>

<body>

<header>

<div class="logo">

<img src="img/logo.png">

</div>

<nav>

<a href="home.html">Início</a>
<a href="servicos.html">Serviços</a>
<a href="agendamento.html">Agendamento</a>
<a href="meus_agendamentos.html">Meus Agendamentos</a>
<a href="perfil.html">Perfil</a>

</nav>

</header>

<section class="pagina">

<h1>Pagamento</h1>

<p>Escolha a forma de pagamento.</p>

<div class="formulario">

<label>Forma de Pagamento</label>

<select id="formaPagamento" onchange="mostrarPagamento()">

<option value="">Selecione</option>
<option value="pix">Pix</option>
<option value="cartao">Cartão</option>
<option value="dinheiro">Dinheiro</option>

</select>

<div id="pix" style="display:none;">

<h3>Pagamento via Pix</h3>

<p><b>Chave Pix:</b></p>

<p>studioglow@email.com</p>

<button onclick="confirmarPagamento()">
Já Efetuei o Pagamento
</button>

</div>

<div id="cartao" style="display:none;">

<label>Número do Cartão</label>

<input type="text" id="numeroCartao">

<label>Nome do Titular</label>

<input type="text" id="titular">

<label>Validade</label>

<input type="month" id="validade">

<label>CVV</label>

<input type="password" id="cvv" maxlength="3">

<button onclick="pagarCartao()">
Pagar
</button>

</div>

<div id="dinheiro" style="display:none;">

<p>
O pagamento será realizado presencialmente no salão.
</p>

<button onclick="confirmarPagamento()">
Confirmar
</button>

</div>

</div>

</section>

</body>

</html>
