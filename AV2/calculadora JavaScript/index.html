<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <title>Trabalho de DAW - Calculadora</title>
            <style>
                    body { font-family: Arial, sans-serif; background: #e0e0e0; display: flex; justify-content: center; padding-top: 50px; }
                            .calc { background: #333; padding: 20px; border-radius: 10px; width: 260px; }
                                    #visor { 
                                                width: 100%; height: 50px; margin-bottom: 10px; 
                                                            font-size: 24px; text-align: right; padding: 5px;
                                                                        box-sizing: border-box; background: #eee; border: none;
                                                                                }
                                                                                        .grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
                                                                                                button { height: 45px; font-size: 18px; cursor: pointer; border-radius: 5px; border: 1px solid #000; }
                                                                                                        .btn-num { background: #fff; }
                                                                                                                .btn-op { background: #ff9500; color: white; }
                                                                                                                        .btn-limpar { background: #ff3b30; color: white; grid-column: span 2; }
                                                                                                                                .btn-igual { background: #4cd964; color: white; grid-column: span 2; }
                                                                                                                                    </style>
                                                                                                                                    </head>
                                                                                                                                    <body>

                                                                                                                                    <div class="calc">
                                                                                                                                        <input type="text" id="visor" value="0" disabled>
                                                                                                                                            
                                                                                                                                                <div class="grade">
                                                                                                                                                        <button class="btn-limpar" onclick="limparTudo()">Limpar</button>
                                                                                                                                                                <button class="btn-op" onclick="pegarOperador('/')">/</button>
                                                                                                                                                                        <button class="btn-op" onclick="pegarOperador('*')">*</button>

                                                                                                                                                                                <button class="btn-num" onclick="digitar('7')">7</button>
                                                                                                                                                                                        <button class="btn-num" onclick="digitar('8')">8</button>
                                                                                                                                                                                                <button class="btn-num" onclick="digitar('9')">9</button>
                                                                                                                                                                                                        <button class="btn-op" onclick="pegarOperador('-')">-</button>

                                                                                                                                                                                                                <button class="btn-num" onclick="digitar('4')">4</button>
                                                                                                                                                                                                                        <button class="btn-num" onclick="digitar('5')">5</button>
                                                                                                                                                                                                                                <button class="btn-num" onclick="digitar('6')">6</button>
                                                                                                                                                                                                                                        <button class="btn-op" onclick="pegarOperador('+')">+</button>

                                                                                                                                                                                                                                                <button class="btn-num" onclick="digitar('1')">1</button>
                                                                                                                                                                                                                                                        <button class="btn-num" onclick="digitar('2')">2</button>
                                                                                                                                                                                                                                                                <button class="btn-num" onclick="digitar('3')">3</button>
                                                                                                                                                                                                                                                                        <button class="btn-num" onclick="digitar('0')">0</button>

                                                                                                                                                                                                                                                                                <button class="btn-num" onclick="digitar('.')">.</button>
                                                                                                                                                                                                                                                                                        <button class="btn-igual" onclick="resultadoFinal()" style="grid-column: span 3;">=</button>
                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                            <script src="script.js"></script>
                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                            </html>
